services:
  auth:
    build: services/auth
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - campushub

  catalog:
    build: services/catalog
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - campushub

  enrollment:
    build: services/enrollment
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
    depends_on:
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - campushub

  grades:
    build: services/grades
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - campushub

  notifications:
    build: services/notifications
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5004/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - campushub

  portal:
    build: services/portal
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AUTH_URL=http://auth:5000
      - CATALOG_URL=http://catalog:5001
      - ENROLLMENT_URL=http://enrollment:5002
      - GRADES_URL=http://grades:5003
    depends_on:
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      enrollment:
        condition: service_healthy
      grades:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - campushub

networks:
  campushub:
    driver: bridge
